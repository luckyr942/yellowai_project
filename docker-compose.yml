version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: coupon_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: coupon_service
      MYSQL_USER: coupon_user
      MYSQL_PASSWORD: coupon_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "coupon_user", "-pcoupon_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
